[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureflow"
version = "0.1.0"
description = "Application Security Automation and Assessment CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "cvss>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
secureflow = "secureflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
