version: 1

targets:
  juice-shop:
    name: "OWASP Juice Shop"
    base_url: "http://127.0.0.1:3000"
    environment: "local-lab"
    source_path: "../juice-shop-source"

  templates:
    name: "Templates React App"
    base_url: "http://127.0.0.1:3000"
    environment: "local-lab"
    source_path: "/home/zygo/code/kokosbet-client-templates"


profiles:
  baseline:
    scanners:
      semgrep:
        enabled: true
      osv:
        enabled: true
      gitleaks:
        enabled: true
      zap:
        enabled: true
        mode: passive

  sast-only:
    scanners:
      semgrep:
        enabled: true

  dependencies:
    scanners:
      osv:
        enabled: true

  secrets:
    scanners:
      gitleaks:
        enabled: true

  web-passive:
    scanners:
      zap:
        enabled: true
        mode: passive

  code-security:
    scanners:
      semgrep:
        enabled: true
      osv:
        enabled: true
      gitleaks:
        enabled: true

reporting:
  formats:
    - json
    - markdown
  output_dir: "output"
